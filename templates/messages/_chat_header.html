<div class="chat-header">

    <div class="chat-user">

        <a href="{{ url_for('messages.inbox') }}"
           class="btn btn-light rounded-circle me-3">

            <i class="bi bi-arrow-left"></i>

        </a>

        {% if other_user.member_profile and other_user.member_profile.passport %}

            <img src="{{ url_for('static',
                filename='uploads/' + other_user.member_profile.passport) }}"
                 class="chat-avatar">

        {% else %}

            <img src="{{ url_for('static',
                filename='images/default-avatar.png') }}"
                 class="chat-avatar">

        {% endif %}

        <div class="chat-user-info">

            <h5>{{ other_user.full_name }}</h5>

            <small>

                <span class="text-success">●</span>

                {{ other_user.role }}

            </small>

        </div>

    </div>

    <div class="d-flex align-items-center">

        <button class="btn btn-light rounded-circle me-2">

            <i class="bi bi-search"></i>

        </button>

        <button class="btn btn-light rounded-circle">

            <i class="bi bi-three-dots-vertical"></i>

        </button>

    </div>

</div>
