{% extends "layout.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i>
                    Add Approved Student ID
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Student Index Number
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            class="form-control"
                            placeholder="e.g. USTED/IT/26/0001"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        Save

                    </button>

                    <a
                        href="{{ url_for('member_indexes.index') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
