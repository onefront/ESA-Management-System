{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="fw-bold">
    <i class="bi bi-pencil-square text-warning"></i>
    Edit Election
</h2>

<a>
<p class="text-uted">

</p>

<!--{{ url_for('elections.dashboard') }}-->
<!--class="btn btn-secondary">-->

<!--<i class="bi bi-arrow-left"></i>-->

<!--Back-->

</a>

</div>

<div class="card shadow-sm border-0">

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Election Name

</label>

<input
type="text"
name="election_name"
class="form-control"
value="{{ election.election_name }}"
required>
</div>

<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
name="description"
class="form-control"
rows="4">{{ election.description }}</textarea>

</div>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Start Date & Time

</label>

<input
type="datetime-local"
name="start_date"
class="form-control"
value="{{ election.start_date.strftime('%Y-%m-%dT%H:%M') }}"
required>

</div>

<div class="col-md-6">

<label class="form-label">

End Date & Time

</label>

<input
type="datetime-local"
name="end_date"
class="form-control"
required>

</div>

</div>

<div class="mt-3">

<label class="form-label">

Status

</label>

<select
name="status"
class="form-select">

<option value="Pending">

Pending

</option>

<option value="Active">

Active

</option>

<option value="Closed">

Closed

</option>

</select>

</div>

<div class="mt-4">

<button
class="btn btn-primary">

<i class="bi bi-save"></i>

Update Election

</button>



</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
