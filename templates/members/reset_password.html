{% extends "layout.html" %}

{% block title %}Reset Member Password{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                <i class="bi bi-key-fill"></i>

                Reset Member Password

            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Member Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.full_name }}"
                            readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.student_id }}"
                            readonly>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="mb-4">

                    <button
                        type="button"
                        class="btn btn-outline-primary"
                        onclick="generatePassword()">

                        <i class="bi bi-magic"></i>

                        Generate Password

                    </button>

                </div>

                <hr>

                <a
                    href="{{ url_for('members.members') }}"
                    class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Back

                </a>

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Reset Password

                </button>

            </form>

        </div>

    </div>

</div>

<script>

function generatePassword(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789@#$";

    let password = "";

    for(let i = 0; i < 10; i++){

        password += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );

    }

    document.getElementById("password").value = password;
    document.getElementById("confirm_password").value = password;

}

</script>

{% endblock %}
