{% extends "layout.html" %}

{% block content %}

<div class="mb-4">

    <a href="{{ url_for('library.dashboard') }}"
       class="btn btn-secondary">

        ← Back to Digital Library

    </a>

</div>

    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                📤 Upload Past Question
            </h4>

        </div>

        <div class="card-body">

           <form
    method="POST"
    enctype="multipart/form-data"
>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Programme
        </label>

        <select
    class="form-select"
    name="programme_id"
>

    <option value="">
        Select Programme
    </option>

    {% for programme in programmes %}

    <option value="{{ programme.id }}">

        {{ programme.programme_name }}

    </option>

    {% endfor %}

</select>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Level
        </label>

        <select
    class="form-select"
    name="level"
>

            <option>Level 100</option>
            <option>Level 200</option>
            <option>Level 300</option>
            <option>Level 400</option>

        </select>

    </div>

</div>


<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Course Code
        </label>

        <input
    type="text"
    name="course_code"
    class="form-control"
    placeholder="ICT343"
>
    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Course Title
        </label>

        <input
    type="text"
    name="course_title"
    class="form-control"
    placeholder="Web Programming"
>

    </div>

</div>


<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Academic Year
        </label>

       <input
    type="text"
    name="academic_year"
    class="form-control"
    placeholder="2025/2026"
>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Semester
        </label>

        <select
    class="form-select"
    name="semester"
>

            <option>First Semester</option>
            <option>Second Semester</option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Exam Type
        </label>

        <select
    class="form-select"
    name="exam_type"
>

            <option>Midsem</option>
            <option>End Semester</option>
            <option>Supplementary</option>

        </select>

    </div>

</div>


<div class="mb-3">

    <label class="form-label">

        PDF File

    </label>

    <input
    type="file"
    name="pdf_file"
    class="form-control"
    accept=".pdf"
>

</div>


<div class="text-end">

    <button
        class="btn btn-primary"
        type="submit"
    >

        Upload Resource

    </button>

</div>

</form>

        </div>

    </div>

</div>

{% endblock %}
