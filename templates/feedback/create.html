{% extends "layout.html" %}

{% block title %}Submit Complaint{% endblock %}

{% block content %}
<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Submit Complaint</h4>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Complaint Type</label>

                    <select name="feedback_type" class="form-select" required>
                        <option value="">Select Type</option>
                        <option>Complaint</option>
                        <option>Suggestion</option>
                        <option>Academic Issue</option>
                        <option>Welfare</option>
                        <option>Misconduct</option>
                        <option>Appreciation</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>

                    <input
                        type="text"
                        name="subject"
                        class="form-control"
                        maxlength="200"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea
                        name="description"
                        rows="6"
                        class="form-control"
                        required></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">Priority</label>

                        <select
                            name="priority"
                            class="form-select">

                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                            <option>Urgent</option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Anonymous</label>

                        <select
                            name="anonymous"
                            class="form-select">

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">
                        Attachment (Optional)
                    </label>

                    <input
                        type="file"
                        name="attachment"
                        class="form-control">

                </div>

                <div class="mt-4">

                    <button
                        class="btn btn-primary">

                        Submit Complaint

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
{% endblock %}
