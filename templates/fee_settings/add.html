{% extends "layout.html" %}

{% block title %}Add Fee Setting{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Add Fee Setting
            </h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- Academic Year -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Academic Year</label>
                        <input
                            type="text"
                            name="academic_year"
                            class="form-control"
                            placeholder="2026/2027"
                            required>
                    </div>

                    <!-- Registration Fee -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Registration Fee</label>
                        <input
                            type="number"
                            step="0.01"
                            name="registration_fee"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- Annual Dues -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Annual Dues</label>
                        <input
                            type="number"
                            step="0.01"
                            name="annual_dues"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- ESA Cloth -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">ESA Cloth</label>
                        <input
                            type="number"
                            step="0.01"
                            name="esa_cloth"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- Excursion Fee -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Excursion Fee</label>
                        <input
                            type="number"
                            step="0.01"
                            name="excursion_fee"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- Event Fee -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Event Fee</label>
                        <input
                            type="number"
                            step="0.01"
                            name="event_fee"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- Welfare Contribution -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Welfare Contribution</label>
                        <input
                            type="number"
                            step="0.01"
                            name="welfare_levy"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- Other Fee -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Other Fee</label>
                        <input
                            type="number"
                            step="0.01"
                            name="other_fee"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <!-- Active -->
                    <div class="col-md-6 mb-3 d-flex align-items-center">
                        <div class="form-check mt-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="active"
                                checked>

                            <label class="form-check-label">
                                Set as Active Fee
                            </label>

                        </div>
                    </div>

                </div>

                <hr>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    Save Fee Setting
                </button>

                <a
                    href="{{ url_for('fee_settings.index') }}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
