{% extends "layout.html" %}

{% block content %}


<div class="container py-4">

    <div class="card shadow border-0 rounded-4">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Appoint Course Representative
            </h4>
        </div>

        <div class="card-body">

            <form method="POST"
      action="{{ url_for('course_reps.search_course_rep_member') }}">

                <!-- Search Section -->
                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Search by Index Number
                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            class="form-control"
                            name="student_id"
                            placeholder="Enter Student Index Number"
                            value="{{ request.form.student_id if request.form.student_id else '' }}">

                        <button
                            type="submit"
                            name="action"
                            value="search"
                            class="btn btn-primary">

                            <i class="bi bi-search"></i>

                            Search

                        </button>

                    </div>

                </div>

                <hr>
            </form>
                {% if member %}
                    <form method="POST"
      action="{{ url_for('course_reps.add_course_rep') }}">
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Member Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.first_name }} {{ member.last_name }}"
                            readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Index Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.student_id }}"
                            readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Programme
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.programme }}"
                            readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.department }}"
                            readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Level
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.level }}"
                            readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Session
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ member.session }}"
                            readonly>

                    </div>

                </div>

                <input
                    type="hidden"
                    name="member_id"
                    value="{{ member.id }}">

                <div class="mb-3">

                    <label class="form-label">
                        Position
                    </label>

                    <select
                        name="position"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select Position --
                        </option>

                        <option value="Course Rep">
                            Course Representative
                        </option>

                        <option value="Assistant Course Rep">
                            Assistant Course Representative
                        </option>

                    </select>

                </div>

                {% endif %}

                <hr>

                <a href="{{ url_for('course_reps.course_reps') }}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Back

                </a>

                {% if member %}

                <button
                    type="submit"
                    name="action"
                    value="appoint"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Appoint

                </button>
                 </form>
                {% endif %}



        </div>

    </div>

</div>

{% endblock %}
