{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow border-0">

        <div class="card-header bg-warning text-dark">

            <h4 class="mb-0">
                <i class="bi bi-pencil-square"></i>
                Edit Student Index
            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Student ID
                    </label>

                    <input
                        type="text"
                        name="student_id"
                        class="form-control"
                        value="{{ index.student_id }}"
                        required>

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('member_indexes.index') }}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                    <button class="btn btn-warning">

                        <i class="bi bi-check-circle"></i>

                        Update Student ID

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
