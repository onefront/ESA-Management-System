{% extends "member_portal/layout2.html" %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm">

        <div class="card-body text-center p-5">

            <i class="bi bi-chat-square-x display-1 text-danger"></i>

            <h2 class="mt-4">
                ESA VIBES is currently unavailable
            </h2>

            <p class="text-muted mt-3">

                The administrator has temporarily disabled the chat system.

            </p>

            <p class="text-muted">

                Please try again later.

            </p>

            {% if current_user.role == "Member" %}

<a href="{{ url_for('member_portal.dashboard') }}"
   class="btn btn-primary mt-3">

{% else %}

<a href="{{ url_for('dashboard.dashboard') }}"
   class="btn btn-primary mt-3">

{% endif %}

                Return to Dashboard

            </a>

        </div>

    </div>

</div>

{% endblock %}
