{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                <i class="bi bi-plus-circle"></i>
                Add Department
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Department Name</label>

                   <input
    type="text"
    class="form-control"
    name="department_name"
    value="{{ department.department_name }}"
    required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Programme</label>

                    <select
                        class="form-select"
                        name="programme_id"
                        required>

                        <option value="">-- Select Programme --</option>

                        {% for programme in programmes %}

<option
    value="{{ programme.id }}"
    {% if programme.id == department.programme_id %}selected{% endif %}>

    {{ programme.programme_name }}

</option>

{% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Status</label>

                    <select
                        class="form-select"
                        name="status">

                     <option
    value="Active"
    {% if department.status == "Active" %}selected{% endif %}>
    Active
</option>

<option
    value="Inactive"
    {% if department.status == "Inactive" %}selected{% endif %}>
    Inactive
</option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Save Department

                </button>

                <a href="{{ url_for('elections.dashboard') }}"
   class="btn btn-secondary">

    Cancel

</a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
