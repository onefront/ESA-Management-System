{% extends "layout.html" %}

{% block title %}Add Fee Setting{% endblock %}

{% block content %}


<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4 class="mb-0">

Add Fee Setting

</h4>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Academic Year</label>

<input
type="text"
name="academic_year"
class="form-control"
placeholder="2026/2027"
required>

</div>

<div class="col-md-6 mb-3">

<label>Registration Fee</label>

<input
type="number"
step="0.01"
name="registration_fee"
class="form-control"
value="200"
required>

</div>

<div class="col-md-6 mb-3">

<label>Annual Dues</label>

<input
type="number"
step="0.01"
name="annual_dues"
class="form-control"
value="50"
required>

</div>

<div class="col-md-6 mb-3">

<label>Welfare Levy</label>

<input
type="number"
step="0.01"
name="welfare_levy"
class="form-control"
value="0">

</div>

<div class="col-md-6 mb-3">

<label>Other Fee</label>

<input
type="number"
step="0.01"
name="other_fee"
class="form-control"
value="0">

</div>

<div class="col-md-6 mb-3 d-flex align-items-center">

<div class="form-check mt-4">

<input
class="form-check-input"
type="checkbox"
name="active"
checked>

<label class="form-check-label">

Set as Active Fee

</label>

</div>

</div>

</div>

<hr>

<button class="btn btn-primary">

<i class="fas fa-save"></i>

Save Fee Setting

</button>

<a
href="{{ url_for('fee_settings.index') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
