{% extends "layout.html" %}

{% block content %}

<a href="{{ url_for('members.members') }}"
   class="btn btn-outline-secondary mb-3">

    <i class="bi bi-arrow-left"></i>

    Back to Members

</a>

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">

            <i class="bi bi-mortarboard-fill text-success"></i>

            Graduation Wizard

        </h2>

        <p class="text-muted">

            Review members who are eligible to move to Alumni.

        </p>

    </div>

</div>

<div class="card shadow-sm mb-4">

    <div class="card-body text-center">

        <h5>Eligible Members</h5>

        <h1 class="text-success">

            {{ members|length }}

        </h1>

    </div>

</div>

<div class="card">

    <div class="card-body">
              <form method="POST">
        <table class="table table-hover align-middle">

            <thead>

                <tr>

    <th>
        <input type="checkbox" id="selectAll">
    </th>

    <th>Name</th>

    <th>Student ID</th>

    <th>Programme</th>

    <th>Level</th>

    <th>Academic Year</th>

    <th>Status</th>

</tr>

            </thead>

            <tbody>

            {% for member in members %}

                <tr>

    <td>

        <input
            type="checkbox"
            name="members"
            value="{{ member.id }}"
            class="member-check">

    </td>
            {% endfor %}

            </tbody>

        </table>
                  <div class="mt-3">

    <button
        class="btn btn-success">

        <i class="bi bi-mortarboard-fill"></i>

        Graduate Selected Members

    </button>

</div>

</form>
    </div>

</div>

<script>

document.getElementById("selectAll").addEventListener(
    "change",
    function () {

        document.querySelectorAll(".member-check").forEach(

            function (checkbox) {

                checkbox.checked = document.getElementById("selectAll").checked;

            }

        );

    }
);

</script>


{% endblock %}
