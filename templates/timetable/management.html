{% extends "layout.html" %}

{% block title %}Timetable Management{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>📅 Timetable Management Center</h3>

        </div>
           <div class="card-body">

    <a href="{{ url_for('dashboard.dashboard') }}"
       class="btn btn-secondary mb-3">

        <i class="fas fa-arrow-left"></i>
        Back to Dashboard

    </a>
        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">

                    <a href="{{ url_for('timetable.upload') }}"
                       class="btn btn-primary w-100 p-3">

                        📤 Upload Timetable

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="{{ url_for('timetable.records') }}"
                       class="btn btn-success w-100 p-3">

                        📋 View Records

                    </a>

                </div>

                <div class="col-md-4">

                     <a href="#"

                       class="btn btn-warning w-100 p-3">
                        ➕ Add Record

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="{{ url_for('timetable.print_timetable') }}"
                       class="btn btn-info w-100 p-3">


                        🖨 Print Timetable

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="{{ url_for('timetable.export_pdf') }}"
                       class="btn btn-warning w-100 p-3">

                        📄 Export PDF

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="{{ url_for('timetable.export_excel') }}"
                       class="btn btn-dark w-100 p-3">

                        📊 Export Excel

                    </a>

                </div>

                <div class="col-md-4">

                    <a href="{{ url_for('timetable.clear_timetable') }}"
                       class="btn btn-danger w-100 p-3">

                        🗑 Clear Timetable

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
