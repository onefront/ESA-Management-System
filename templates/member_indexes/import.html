{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Import Student Index Numbers</h2>

        <div>

            <a href="{{ url_for('member_indexes.download_sample') }}"
               class="btn btn-info">

                <i class="fas fa-download"></i>
                Download Sample

            </a>

            <a href="{{ url_for('member_indexes.index') }}"
               class="btn btn-secondary">

                <i class="fas fa-arrow-left"></i>
                Back

            </a>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Select Excel File
                    </label>

                    <input
                        type="file"
                        name="excel_file"
                        class="form-control"
                        accept=".xlsx"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="fas fa-upload"></i>
                    Import

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
