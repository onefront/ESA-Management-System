{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Edit Academic Resource</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Programme</label>

                        <select name="programme_id" class="form-control">

                            {% for programme in programmes %}

                            <option value="{{ programme.id }}"
                            {% if programme.id == resource.programme_id %}selected{% endif %}>
                                {{ programme.programme_name }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Level</label>

                        <input
                            type="text"
                            name="level"
                            class="form-control"
                            value="{{ resource.level }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Course Code</label>

                        <input
                            type="text"
                            name="course_code"
                            class="form-control"
                            value="{{ resource.course_code }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Course Title</label>

                        <input
                            type="text"
                            name="course_title"
                            class="form-control"
                            value="{{ resource.course_title }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Academic Year</label>

                        <input
                            type="text"
                            name="academic_year"
                            class="form-control"
                            value="{{ resource.academic_year }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Semester</label>

                        <input
                            type="text"
                            name="semester"
                            class="form-control"
                            value="{{ resource.semester }}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Exam Type</label>

                        <input
                            type="text"
                            name="exam_type"
                            class="form-control"
                            value="{{ resource.exam_type }}">
                    </div>

                </div>

                <button class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{{ url_for('library.manage_resources') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
