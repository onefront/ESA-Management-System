{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Add System User</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Role</label>

                    <label>Role</label>

<select
    name="role"
    class="form-select">

    <option>Administrator</option>
    <option>Treasurer</option>
    <option>General Secretary</option>
    <option>Executive</option>
    <option>Course Representative</option>
    <option>Member</option>

</select>

                </div>

                <button
                    class="btn btn-success">

                    Save User

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
