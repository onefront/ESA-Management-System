{% extends "layout.html" %}

{% block title %}Add Slide{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header">
                    <h4 class="mb-0">
                        🖼 Add New Slide
                    </h4>
                </div>

                <div class="card-body">

                    <form method="POST"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">
                                Slide Title
                            </label>

                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Subtitle
                            </label>

                            <textarea
                                name="subtitle"
                                class="form-control"
                                rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Button Text
                            </label>

                            <input type="text"
                                   name="button_text"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Button Link
                            </label>

                            <input type="text"
                                   name="button_link"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Display Order
                            </label>

                            <input type="number"
                                   name="display_order"
                                   value="1"
                                   class="form-control">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Slide Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control"
                                   accept="image/*"
                                   required>
                        </div>

                        <button
                            class="btn btn-success">

                            Save Slide

                            <div class="form-check mb-4">

    <input
        class="form-check-input"
        type="checkbox"
        name="is_active"
        checked>

    <label class="form-check-label">

        Active Slide

    </label>

</div>

                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
