{% extends "layout.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">

                        ESA Online Voting

                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Student ID

                            </label>

                            <input
                                type="text"
                                name="student_id"
                                class="form-control"
                                required>

                        </div>

                        <button
                            class="btn btn-primary w-100">

                            Continue

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
