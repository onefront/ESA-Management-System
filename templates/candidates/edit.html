{% extends "layout.html" %}

{% block content %}
<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header">
            <h3>Edit Candidate</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Election</label>
                    <select name="election_id" class="form-select">

                        {% for election in elections %}
                        <option value="{{ election.id }}"
                        {% if election.id == candidate.election_id %}selected{% endif %}>
                            {{ election.election_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Portfolio</label>
                    <select name="portfolio_id" class="form-select">

                        {% for portfolio in portfolios %}
                        <option value="{{ portfolio.id }}"
                        {% if portfolio.id == candidate.portfolio_id %}selected{% endif %}>
                            {{ portfolio.portfolio_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Candidate</label>
                    <select name="member_id" class="form-select">

                        {% for member in members %}
                        <option value="{{ member.id }}"
                        {% if member.id == candidate.member_id %}selected{% endif %}>
                            {{ member.first_name }} {{ member.last_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label>Slogan</label>
                    <input type="text"
                           name="slogan"
                           class="form-control"
                           value="{{ candidate.slogan }}">
                </div>

                <div class="mb-3">
                    <label>Manifesto</label>
                    <textarea name="manifesto"
                              rows="5"
                              class="form-control">{{ candidate.manifesto }}</textarea>
                </div>

                <div class="mb-3">
                    <label>Status</label>

                    <select name="status" class="form-select">

                        <option value="Active"
                        {% if candidate.status=="Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                        {% if candidate.status=="Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

                <button class="btn btn-primary">
                    Update Candidate
                </button>

                <a href="{{ url_for('candidates.candidates') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>
{% endblock %}
