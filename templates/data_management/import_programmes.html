{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-upload"></i>

                Import Programmes

            </h3>

        </div>

        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data">

                <div class="mb-3">

                    <label>

                        Excel File

                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="file"
                        accept=".xlsx"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    <i class="bi bi-upload"></i>

                    Import

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
