{% extends "layout.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-header bg-warning">
            <h4 class="mb-0">
                🔄 Reset Voters
            </h4>
        </div>

        <div class="card-body">

            <div class="alert alert-warning">
                <strong>Important:</strong>
                You can reset up to 10 Index Numbers at once.
                Resetting a voter removes their votes from the
                current election and allows the Index Number to
                vote again.
            </div>

            <form method="POST">

                <div class="row g-3">

                    {% for i in range(1, 11) %}

                    <div class="col-md-6">

                        <label class="form-label">
                            Index Number {{ i }}
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            class="form-control"
                            placeholder="Enter Index Number"
                        >

                    </div>

                    {% endfor %}

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-warning"
                        onclick="return confirm(
                            'Are you sure you want to reset these voters? Their current-election votes will be removed.'
                        );"
                    >
                        🔄 Reset Voters
                    </button>

                    <a
                        href="{{ url_for('voting.dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
