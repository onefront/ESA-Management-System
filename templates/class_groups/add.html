{% extends "layout.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-primary text-white">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h4 class="mb-0">
                            <i class="bi bi-mortarboard-fill"></i>
                            Academic Class Registration
                        </h4>
                        <small>Create a new Academic Class</small>
                    </div>

                    <a href="{{ url_for('class_groups.index') }}"
                       class="btn btn-light btn-sm">
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </a>

                </div>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Programme
                            </label>

                            <select
                                class="form-select"
                                name="programme_id"
                                id="programme"
                                required>

                                <option value="">Select Programme</option>

                                {% for programme in programmes %}
                                <option value="{{ programme.id }}">
                                    {{ programme.programme_name }}
                                </option>
                                {% endfor %}

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Session
                            </label>

                            <select
                                class="form-select"
                                name="session"
                                id="session"
                                required>

                                <option value="Weekend">Weekend</option>
                                <option value="Evening">Evening</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Level
                            </label>

                            <select
                                class="form-select"
                                name="level"
                                id="level"
                                required>

                                <option value="100">100</option>
                                <option value="200">200</option>
                                <option value="300">300</option>
                                <option value="400">400</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Admission Year
                            </label>

                            <select
                                class="form-select"
                                name="admission_year"
                                id="admission"
                                required>

                                {% for year in admission_years %}
                                <option value="{{ year }}">
                                    {{ year }}
                                </option>
                                {% endfor %}

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Graduation Year
                            </label>

                            <input
                                type="text"
                                id="graduation"
                                name="graduation_year"
                                class="form-control"
                                readonly>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-semibold">
                                Status
                            </label>

                            <select
                                class="form-select"
                                name="status">

                                <option value="Active">
                                    Active
                                </option>

                                <option value="Inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>

                        <div class="col-12">

                            <label class="form-label fw-semibold">
                                Academic Class Code
                            </label>

                            <input
                                class="form-control bg-light fw-bold"
                                id="class_code"
                                readonly>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">

                        <a href="{{ url_for('class_groups.index') }}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                        <button
                            class="btn btn-primary"
                            type="submit">

                            <i class="bi bi-check-circle"></i>

                            Save Academic Class

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

<script>

function updateGraduation(){

    let admission=document.getElementById("admission").value;

    if(!admission) return;

    let start=parseInt(admission.split("/")[0]);

    document.getElementById("graduation").value=
        (start+3)+"/"+(start+4);

}

document.getElementById("admission")
.addEventListener("change",updateGraduation);

updateGraduation();

</script>

{% endblock %}
