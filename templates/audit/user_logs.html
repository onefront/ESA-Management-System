{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

<h3>
Activity History

<small class="text-primary">
{{ username }}
</small>

</h3>
<div class="mb-3">

    <a href="{{ url_for('audit.dashboard') }}"
       class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>
        Back to Audit Dashboard

    </a>

</div>
<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Date</th>
<th>Module</th>
<th>Action</th>
<th>Description</th>

</tr>

</thead>

<tbody>

{% for log in logs %}

<tr>

<td>{{ log.action_time.strftime("%d %b %Y %I:%M %p") }}</td>

<td>{{ log.module }}</td>

<td>{{ log.action }}</td>

<td>{{ log.description }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
