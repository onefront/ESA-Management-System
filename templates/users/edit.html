{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit User</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ user.full_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Role</label>

                    <select
                        name="role"
                        class="form-select">

                        <option {% if user.role=="Administrator" %}selected{% endif %}>Administrator</option>
                        <option {% if user.role=="Treasurer" %}selected{% endif %}>Treasurer</option>
                        <option {% if user.role=="General Secretary" %}selected{% endif %}>General Secretary</option>
                        <option {% if user.role=="Executive" %}selected{% endif %}>Executive</option>
                        <option {% if user.role=="Course Representative" %}selected{% endif %}>Course Representative</option>

                    </select>

                </div>

                <button
                    class="btn btn-warning">

                    Update User

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
