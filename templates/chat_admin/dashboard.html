{% extends "layout.html" %}

{% block content %}

<div class="container py-4">

    <h2 class="mb-4">
        <i class="bi bi-chat-square-text"></i>
        Chat Management
    </h2>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">

                    <i class="bi bi-gear display-5 text-primary"></i>

                    <h5 class="mt-3">
                        Chat Settings
                    </h5>

                    <p class="text-muted">
                        Configure the chat system.
                    </p>

                    <a href="{{ url_for('chat_admin.settings') }}"
                       class="btn btn-primary w-100">

                               Open

                                </a>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">

                    <i class="bi bi-megaphone display-5 text-success"></i>

                    <h5 class="mt-3">
                        Broadcast
                    </h5>

                    <p class="text-muted">
                        Send announcements.
                    </p>

                   <a href="{{ url_for('chat_admin.broadcast') }}"
   class="btn btn-success w-100">

    Open

</a>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">

                    <i class="bi bi-slash-circle display-5 text-danger"></i>

                    <h5 class="mt-3">
                        Blocked Users
                    </h5>

                    <p class="text-muted">
                        Manage blocked members.
                    </p>

                  <a href="{{ url_for('chat_block.index') }}"
                    class="btn btn-primary w-100">

    Open

</a>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">

                    <i class="bi bi-bar-chart display-5 text-warning"></i>

                    <h5 class="mt-3">
                        Reports
                    </h5>

                    <p class="text-muted">
                        View chat statistics.
                    </p>

                    <a href="#"
                       class="btn btn-warning w-100">

                        Open

                    </a>

                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
