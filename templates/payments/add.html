{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Add Payment</h3>
        </div>

        <div class="card-body">

            <h5>{{ member.first_name }} {{ member.last_name }}</h5>

            <p><strong>ESA ID:</strong> {{ member.esa_id }}</p>

            <form method="POST" action="{{ url_for('payments.add_payment', member_id=member.id) }}">

                <div class="mb-3">
                    <label class="form-label">Payment Type</label>
                    <select class="form-select" name="payment_type" required>
                        <option value="">Select Payment Type</option>
                        <option>Registration Fee</option>
                        <option>Annual Dues</option>
                        <option>Excursion Fee</option>
                        <option>Welfare Contribution</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount (GH₵)</label>
                    <input type="number"
                           step="0.01"
                           class="form-control"
                           name="amount"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" name="payment_method">
                        <option>Cash</option>
                        <option>Mobile Money</option>
                        <option>Bank Transfer</option>
                    </select>
                </div>

                <div class="mb-3">
    <label class="form-label">Receipt Number</label>

    <input
        type="text"
        class="form-control"
        value="Generated Automatically"
        readonly>
</div>
                <button type="submit" class="btn btn-success">
                    Save Payment
                </button>

                <a href="{{ url_for('payments.member_payments', member_id=member.id) }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
