{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="bi bi-person-plus-fill text-primary"></i>

                Register Candidate

            </h2>

            <p class="text-muted">

                Register an ESA member as an election candidate.

            </p>

        </div>

        <a href="{{ url_for('candidates.candidates') }}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Election
                        </label>

                        <select
                            name="election_id"
                            class="form-select"
                            required>

                            <option value="">
                                -- Select Election --
                            </option>

                            {% for election in elections %}

                            <option value="{{ election.id }}">
                                {{ election.election_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Portfolio
                        </label>

                        <select
                            name="portfolio_id"
                            class="form-select"
                            required>

                            <option value="">
                                -- Select Portfolio --
                            </option>

                            {% for portfolio in portfolios %}

                            <option value="{{ portfolio.id }}">
                                {{ portfolio.portfolio_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Member
                    </label>

                    <select
                        name="member_id"
                        class="form-select"
                        required>

                        <option value="">
                            -- Select ESA Member --
                        </option>

                        {% for member in members %}

                        <option value="{{ member.id }}">
                            {{ member.first_name }}
                            {{ member.last_name }}
                            ({{ member.esa_id }})
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Campaign Slogan
                    </label>

                    <input
                        type="text"
                        name="slogan"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Manifesto
                    </label>

                    <textarea
                        name="manifesto"
                        rows="5"
                        class="form-control"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-save"></i>

                    Register Candidate

                </button>

                <a href="{{ url_for('candidates.candidates') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
