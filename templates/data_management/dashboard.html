{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            <i class="bi bi-database-fill-gear"></i>

            Data Management

        </h2>

    </div>

    <div class="row">

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-upload display-4 text-primary"></i>

                    <h4 class="mt-3">

                        Import Programmes

                    </h4>

                    <p>

                        Import programmes from an Excel file.

                    </p>

                    <a
                        href="{{ url_for('data_management.import_programmes') }}"
                        class="btn btn-primary">

                        Open

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-download display-4 text-success"></i>

                    <h4 class="mt-3">

                        Export Programmes

                    </h4>

                    <p>

                        Download all programmes to Excel.

                    </p>


                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <i class="bi bi-file-earmark-excel display-4 text-warning"></i>
<a
    href="{{ url_for('data_management.download_programme_template') }}"
    class="btn btn-success">

    <i class="bi bi-download"></i>

    Download Template

</a>

                    <p>

                        Download the Excel template for imports.

                    </p>

                    <a
                        href="{{ url_for('data_management.download_programme_template') }}"
                        class="btn btn-warning">

                        Download

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
