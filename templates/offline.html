<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | ESA Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">

    <style>
        body{
            font-family:Poppins,sans-serif;
            background:#f5f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
            max-width:420px;
        }

        img{
            width:90px;
            margin-bottom:20px;
        }

        h2{
            color:#0d6efd;
        }

        a{
            display:inline-block;
            margin-top:20px;
            padding:12px 24px;
            background:#0d6efd;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="{{ url_for('static', filename='images/logo.png') }}">

    <h2>You're Offline</h2>

    <p>
        Please reconnect to the internet to continue using
        the ESA Management System.
    </p>

    <a href="/">Retry</a>

</div>

</body>
</html>
