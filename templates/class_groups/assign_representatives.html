{% extends "layout.html" %}

{% block title %}Assign Representatives{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>
            <i class="fas fa-users"></i>
            Assign Class Representatives
        </h3>

        <a href="{{ url_for('class_groups.view', id=group.id) }}"
           class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i>
            Back
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-header">
            <strong>{{ group.name }}</strong>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Course Representative
                    </label>

                    <select
                        name="course_rep"
                        class="form-select">

                        <option value="">
                            -- Select Member --
                        </option>

                        {% for member in members %}

                        <option value="{{ member.id }}">
                            {{ member.student_id }}
                            -
                            {{ member.last_name }}
                            {{ member.first_name }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <button
                    class="btn btn-primary">

                    Save Representative

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
