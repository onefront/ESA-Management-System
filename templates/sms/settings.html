{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="mb-1">
                <i class="bi bi-gear-wide-connected"></i>
                SMS Settings
            </h3>

            <p class="text-muted mb-0">
                Configure the MNotify SMS service for ESA CONNECT.
            </p>
        </div>

        <a href="{{ url_for('sms.dashboard') }}"
           class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i>
            Back
        </a>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">
                <i class="bi bi-chat-dots"></i>
                SMS Provider Configuration
            </h5>

        </div>


        <div class="card-body">

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            SMS Provider
                        </label>

                        <input
                            type="text"
                            name="provider"
                            class="form-control"
                            value="{{ settings.provider or 'MNotify' }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Sender ID
                        </label>

                        <input
                            type="text"
                            name="sender_id"
                            class="form-control"
                            value="{{ settings.sender_id or '' }}"
                            placeholder="ESA CONNECT"
                            maxlength="20"
                            required
                        >

                        <small class="text-muted">
                            This is the name recipients will see as the sender.
                        </small>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            MNotify API Key
                        </label>

                        <input
                            type="password"
                            name="api_key"
                            class="form-control"
                            value="{{ settings.api_key or '' }}"
                            required
                        >

                        <small class="text-muted">
                            Keep your API key private.
                        </small>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            API Base URL
                        </label>

                        <input
                            type="url"
                            name="base_url"
                            class="form-control"
                            value="{{ settings.base_url }}"
                            required
                        >

                    </div>


                    <div class="col-12">

                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_active"
                                id="is_active"
                                {% if settings.is_active %}
                                checked
                                {% endif %}
                            >

                            <label
                                class="form-check-label"
                                for="is_active"
                            >
                                Enable SMS Service
                            </label>

                        </div>

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex justify-content-end">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check-circle"></i>
                        Save SMS Settings
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
