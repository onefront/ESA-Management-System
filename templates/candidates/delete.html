{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header bg-danger text-white">

            <h3 class="mb-0">
                Delete Candidate
            </h3>

        </div>

        <div class="card-body">

            <p class="lead">

                Are you sure you want to delete

                <strong>

                    {{ candidate.member.first_name }}
                    {{ candidate.member.last_name }}

                </strong>

                from this election?

            </p>

            <form method="POST">

                <button type="submit"
                        class="btn btn-danger">

                    <i class="bi bi-trash"></i>

                    Delete Candidate

                </button>

                <a href="{{ url_for('candidates.candidates') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
