{% extends "layout.html" %}
{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="bi bi-gear-fill text-secondary"></i>

                Election Settings

            </h2>

            <p class="text-muted">

                Configure the current ESA election.

            </p>

        </div>

        <a href="{{ url_for('elections.dashboard') }}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Active Election

                    </label>

                    <select
                        name="active_election_id"
                        class="form-select">

                        <option value="">

                            -- Select Election --

                        </option>

                        {% for election in elections %}

                        <option
                            value="{{ election.id }}"
                            {% if settings.active_election_id == election.id %}
                            selected
                            {% endif %}>

                            {{ election.election_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Voting Status

                    </label>

                    <select
                        name="voting_status"
                        class="form-select">

                        <option value="Open"
                        {% if settings.voting_status=="Open" %}
                        selected
                        {% endif %}>

                            Open

                        </option>

                        <option value="Closed"
                        {% if settings.voting_status=="Closed" %}
                        selected
                        {% endif %}>

                            Closed

                        </option>

                        <option value="Paused"
                        {% if settings.voting_status=="Paused" %}
                        selected
                        {% endif %}>

                            Paused

                        </option>

                    </select>

                </div>

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="results_visible"
                        {% if settings.results_visible %}
                        checked
                        {% endif %}>

                    <label class="form-check-label">

                        Show Results During Voting

                    </label>

                </div>

                <button
                    class="btn btn-primary">

                    <i class="bi bi-save"></i>

                    Save Settings

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
