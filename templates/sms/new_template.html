{% extends "layout.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

        <h3 class="mb-0">

            <i class="bi bi-plus-circle"></i>

            Create SMS Template

        </h3>

        <a href="{{ url_for('sms.templates') }}"
           class="btn btn-light">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <div class="card-body">

        <form>

            <div class="mb-3">

                <label class="form-label">

                    Template Title

                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Example: Meeting Reminder">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Category

                </label>

                <select class="form-select">

                    <option>Meetings</option>

                    <option>Elections</option>

                    <option>Finance</option>

                    <option>Academics</option>

                    <option>General</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    SMS Message

                </label>

                <textarea
                    rows="8"
                    class="form-control"
                    placeholder="Type your template here..."></textarea>

            </div>

            <div class="text-end">

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Save Template

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
