<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Create ESA Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

body{

background:#f4f7fb;

font-family:Poppins,sans-serif;

}

.card{

border:none;

border-radius:15px;

}

.logo{

width:90px;

}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-7">

<div class="card shadow">

<div class="card-body p-5">

<div class="text-center mb-4">

<img src="{{ url_for('static',
filename='images/logo.png') }}"
class="logo">

<h2 class="mt-3">

Create ESA Account

</h2>

<p class="text-muted">

Register to access ESA CONNECT

</p>

</div>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>

Index Number

</label>

<input
    type="text"
    name="student_id"
    class="form-control"
    value="{{ student_id }}"
    readonly>

</div>

<div class="col-md-6 mb-3">

<label>

Email

</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Optional">
</div>

<div class="col-md-12 mb-3">

<label>

Full Name

</label>

<input
type="text"
name="full_name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="col-md-6 mb-3">

<label>

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>

Confirm Password

</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

</div>

<hr>

<button
class="btn btn-success w-100">

Create My Account

</button>

</form>

<div class="text-center mt-4">

<a href="{{ url_for('auth.login') }}">

Already have an account?

Sign In

</a>

</div>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
